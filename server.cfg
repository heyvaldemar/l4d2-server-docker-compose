// The name players see in the browser and on the scoreboard.
hostname "L4D2 Co-op"

// REQUIRED FOR DIRECT CONNECT. With the default of 1 the server accepts only
// clients arriving through a Steam lobby, and `connect host:port` from the
// console is refused with "Server is enforcing consistency" style silence.
// Friends joining by address need this at 0.
sv_allow_lobby_connect_only 0

// Survivor bots fill the team in co-op, so a solo player has a full squad.
sb_all_bot_game 1
sv_region 255

// Game log settings. sv_logflush 1 forces each line to disk: without it the
// engine buffers the log and flushes only on close, so a quiet server writes
// a file that reports zero bytes while people are talking.
sv_logflush 1
sv_log_onefile 1
log on
sv_logecho 1
