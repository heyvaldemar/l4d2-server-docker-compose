name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: l4d2-server
            env_var: L4D2_SERVER_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" l4d2-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  healthcheck:
    name: The health check, both ways, and the Steam check, against stubs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally: Ubuntu's
        # packaged shellcheck is a different version with different defaults.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 tests/*.sh tools/*.sh

      - name: The Steam check, every branch, against stubbed answers
        run: bash tests/steam-uptodate.sh

      - name: Every script in tools/ is read whole before it runs
        run: bash tests/read-whole.sh

      - name: The timer keeps running the night the clocks go back
        run: bash tests/timers.sh

      - name: The compose file parses with the shipped defaults
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f l4d2-server-docker-compose.yml config >/dev/null
          echo "compose OK"

  boot:
    name: docker compose up + healthy, against the real image
    # The only one of the Source images small enough for a runner: 3.3 GB
    # compressed. It starts in LAN mode with no Steam token, which is enough to
    # prove the compose file, the config mounts and the health check against the
    # actual srcds rather than a fixture.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker 29.4.2 answers socketcall with ENOSYS; give its daemon the profile 29.4.3 ships
        # Docker Engine 29.4.2, and that release alone, blocks the 32-bit
        # socketcall(2) system call in its default seccomp profile
        # (moby/moby#52506). Left 4 Dead 2's srcds, a 32-bit program, makes
        # every socket through it, so on 29.4.2 it dies on start, with Steam and
        # the network both up. 29.4.3 reverted the rule; the ubuntu-26.04 runner
        # image still ships 29.4.2. On that version, and only there, the daemon
        # gets the default profile 29.4.3 ships (moby/profiles seccomp v0.2.3),
        # pinned by commit and checksum. Measured: tf2-server-docker-compose run
        # 42496129688.
        run: |
          v="$(docker version --format '{{.Server.Version}}')"
          if [ "$v" != 29.4.2 ]; then echo "Docker $v: its own profile allows socketcall"; exit 0; fi
          sudo curl -fsSL -o /etc/docker/seccomp-29.4.3.json \
            https://raw.githubusercontent.com/moby/profiles/836ae4d37ef2ec995c77c99fc55f5b5f3af3a897/seccomp/default.json
          echo "536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  /etc/docker/seccomp-29.4.3.json" | sha256sum -c -
          f=/etc/docker/daemon.json
          [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '. + {"seccomp-profile": "/etc/docker/seccomp-29.4.3.json"}' "$f" | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker
          docker info --format '{{.SecurityOptions}}'

      - name: Start the stack with placeholder secrets
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          # A random password, so the command-line check below looks for a
          # value nothing else on the runner could hold.
          sed -i "s/^L4D2_SERVER_RCON_PASSWORD=.*/L4D2_SERVER_RCON_PASSWORD=$(openssl rand -hex 16)/" .env
          docker compose -f l4d2-server-docker-compose.yml -p l4d2 up -d

      - name: Wait for the health check to go green
        run: |
          cid="$(docker compose -f l4d2-server-docker-compose.yml -p l4d2 ps -q l4d2-server)"
          for _ in $(seq 1 60); do
            s="$(docker inspect "$cid" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
            echo "health: $s"
            [ "$s" = healthy ] && exit 0
            [ "$s" = unhealthy ] && break
            sleep 10
          done
          echo "::error::the server never reported healthy"
          docker compose -f l4d2-server-docker-compose.yml -p l4d2 logs --tail 80
          echo "--- the health check's own words, last runs"
          docker inspect "$cid" --format '{{range .State.Health.Log}}exit {{.ExitCode}}: {{.Output}}{{end}}' | tail -c 2000
          echo "--- UDP sockets in the container"
          docker exec "$cid" cat /proc/net/udp
          echo "--- the check, traced"
          docker exec "$cid" bash -x /healthcheck.sh 27015 2>&1 | tail -40
          exit 1

      - name: The health check goes by the game's answer, in the pinned image
        # tools/healthcheck.sh is healthy only on the engine's reply to
        # A2S_INFO. Run in the pinned image (here, where the image is already
        # pulled), so its tools are proven there, against a stand-in that
        # answers, answers after a challenge, stays silent, or is not there at
        # all (tests/fixtures/fake-a2s.py).
        run: |
          chmod +x tests/e2e-healthcheck.sh
          ./tests/e2e-healthcheck.sh

      - name: The server answers a Source query on its own port
        run: |
          # HEALTHY IS NOT LISTENING. The health check says the srcds process
          # exists, which it does ten seconds after start; the map takes a
          # minute or more to load on a runner, and a query sent before that
          # times out. The first run of this job did exactly that. So: A2S_INFO
          # over UDP, from inside the container's namespace, retried for up to
          # six minutes. The reply begins with the 0x49 header, which proves the
          # server is not merely alive but listening on the port the file says
          # it binds.
          # ON THE CONTAINER'S ADDRESS, NOT LOOPBACK. srcds binds the address of
          # its interface rather than 0.0.0.0, so a query to 127.0.0.1 goes
          # unanswered for as long as anyone waits - the second run of this job
          # waited six minutes over a server that had loaded its map in two
          # seconds. The address is read from docker, not guessed.
          cid="$(docker compose -f l4d2-server-docker-compose.yml -p l4d2 ps -q l4d2-server)"
          ip="$(docker inspect "$cid" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')"
          echo "querying $ip:27015"
          for attempt in $(seq 1 36); do
            if docker run --rm --network "container:$cid" -e IP="$ip" python:3.13-alpine python3 -c '
          import os, socket, sys
          ip = os.environ["IP"]
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(8)
          req = b"\xff\xff\xff\xff\x54Source Engine Query\x00"
          try:
              s.sendto(req, (ip, 27015)); d, _ = s.recvfrom(4096)
              if d[4:5] == b"\x41":
                  s.sendto(req + d[5:9], (ip, 27015)); d, _ = s.recvfrom(4096)
          except OSError:
              sys.exit(1)
          if d[4:5] != b"\x49":
              sys.exit(1)
          print("A2S_INFO answered:", d[6:60].split(b"\x00")[0].decode(errors="replace"))
          ' 2>/dev/null; then
              echo "answered on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: no reply yet"
            sleep 10
          done
          echo "::error::the server never answered A2S_INFO on $ip:27015"
          docker logs "$cid" 2>&1 | tail -60
          exit 1

      - name: Steam calls the server current
        # A2S proves the server listens; it does not prove anyone can join.
        # Steam enforces the version, and answers the question directly from
        # the version the server reports: tools/steam-uptodate.sh --check, the
        # script the timer runs (0 current, 1 behind, 3 no answer yet).
        run: |
          for _ in $(seq 1 20); do
            rc=0; tools/steam-uptodate.sh --check || rc=$?
            [ "$rc" = 3 ] || exit "$rc"
            sleep 10
          done
          exit 3

      - name: The RCON password is on no command line
        # srcds kept it in its arguments for as long as it ran, where every
        # user on the host reads it with ps; the entrypoint writes it into
        # cfg/secrets/rcon.cfg instead. Every command line on the runner and in
        # the container is read, compared through a file, so it is never printed.
        run: |
          vals="$(mktemp)"; chmod 600 "$vals"
          sed -n 's/^L4D2_SERVER_RCON_PASSWORD=//p' .env > "$vals"
          [ -s "$vals" ] || { echo "::error::could not read the password from .env"; exit 1; }
          srcds="$(ps -eo comm=,args= | awk '$1 ~ /^srcds/ { $1 = ""; sub(/^ /, ""); print }')"
          # shellcheck disable=SC2009  # every command line on the runner, not one process
          host=$(ps -eo args= | grep -cF -f "$vals" || true)
          # shellcheck disable=SC2016  # expanded by the container's shell
          ctr=$(docker compose -f l4d2-server-docker-compose.yml -p l4d2 exec -T l4d2-server sh -c 'for f in /proc/[0-9]*/cmdline; do tr "\000" " " < "$f" 2>/dev/null; echo; done' | grep -cF -f "$vals" || true)
          rm -f "$vals"
          [ -n "$srcds" ] || { echo "::error::no srcds process on the runner to read"; exit 1; }
          echo "command lines carrying the password: $host on the runner, $ctr in the container"
          [ "$host" = 0 ] && [ "$ctr" = 0 ] || { echo "::error::the password is on a command line"; exit 1; }
          printf '%s\n' "$srcds" | sed 's/^/  srcds: /'
          docker compose -f l4d2-server-docker-compose.yml -p l4d2 exec -T l4d2-server stat -c '%a %U %n' left4dead2/cfg/secrets/rcon.cfg

      - name: rcon answers, and refuses a wrong password
        # The README's rcon command up to v1.3 named a program the image does
        # not have. tools/rcon.sh is the one it names now: status must come
        # back with the hostname line, and a wrong password must be refused.
        run: |
          out="$(tools/rcon.sh status)"; printf '%s\n' "$out" | head -5
          grep -q '^hostname' <<<"$out" || { echo "::error::status did not return the hostname line"; exit 1; }
          cp .env .env.good
          sed -i 's/^L4D2_SERVER_RCON_PASSWORD=.*/L4D2_SERVER_RCON_PASSWORD=not-the-password/' .env
          rc=0; tools/rcon.sh status || rc=$?
          mv .env.good .env
          [ "$rc" = 2 ] || { echo "::error::a wrong password was not refused (exit $rc)"; exit 1; }
          echo "a wrong password: refused, exit 2"

      - name: The health check answers again after a map change
        # A changelevel silences A2S_INFO while the next map loads. The check
        # must answer again within two minutes, on the new map, and Docker's
        # status (three misses at a 60-second interval) must stay healthy.
        run: |
          cid="$(docker compose -f l4d2-server-docker-compose.yml -p l4d2 ps -q l4d2-server)"
          docker exec "$cid" bash /healthcheck.sh 27015
          tools/rcon.sh changelevel c8m2_subway >/dev/null
          t0=$SECONDS; misses=0; ok=""
          while [ $((SECONDS - t0)) -lt 120 ]; do
            if docker exec "$cid" bash /healthcheck.sh 27015 >/dev/null 2>&1; then
              [ $((SECONDS - t0)) -ge 15 ] && { ok=1; break; }
            else
              misses=$((misses + 1))
            fi
            sleep 2
          done
          map="$(tools/rcon.sh status | sed -n 's/^map *: *\([^ ]*\).*/\1/p')"
          s="$(docker inspect "$cid" --format '{{.State.Health.Status}}')"
          echo "after changelevel: map ${map:-?}, $misses missed checks, answering at $((SECONDS - t0))s, docker health: $s"
          [ "$ok" = 1 ] || { echo "::error::the game did not answer again within two minutes of the map change"; exit 1; }
          [ "$map" = c8m2_subway ] || { echo "::error::the map did not change, so this proved nothing"; exit 1; }
          [ "$s" = healthy ] || { echo "::error::docker called it $s across a map change"; exit 1; }

      - name: Plant - a stopped game keeps its process, and the check goes red
        # The check up to v1.3.4 looked for srcds_linux in /proc. SIGSTOP
        # leaves the process there and the game deaf: that check must still
        # pass and this one fail; after SIGCONT this one passes again.
        run: |
          cid="$(docker compose -f l4d2-server-docker-compose.yml -p l4d2 ps -q l4d2-server)"
          # shellcheck disable=SC2016  # expanded by the container's shell
          pid="$(docker exec "$cid" sh -c 'for p in /proc/[0-9]*; do [ "$(cat "$p/comm" 2>/dev/null)" = srcds_linux ] && echo "${p#/proc/}"; done' | head -1)"
          [ -n "$pid" ] || { echo "::error::no srcds_linux process to stop"; exit 1; }
          docker exec "$cid" sh -c "kill -STOP $pid"
          o=0; docker exec "$cid" sh -c "grep -qsx srcds_linux /proc/[0-9]*/comm" || o=$?
          n=0; docker exec "$cid" bash /healthcheck.sh 27015 || n=$?
          docker exec "$cid" sh -c "kill -CONT $pid"
          echo "game stopped: the old check exits $o, the new one $n"
          [ "$o" = 0 ] && [ "$n" = 1 ] || { echo "::error::expected the old check to pass (0) and the new one to fail (1)"; exit 1; }
          for _ in $(seq 1 15); do
            docker exec "$cid" bash /healthcheck.sh 27015 && exit 0
            sleep 2
          done
          echo "::error::the game did not answer again after SIGCONT"; exit 1

      - name: Plant - a stale version turns the check red
        # The version before the current one, written where the server reads
        # it: what this image will look like the day Valve ships an update.
        # The check must call it out of date, and the timer's script must say
        # that only a newer image can fix it.
        run: |
          forge='sed -i -E "s/^(ClientVersion|ServerVersion|PatchVersion)=.*/\1=2.2.4.2/" /server/left4dead2/steam.inf && grep -E "Version=" /server/left4dead2/steam.inf'
          docker compose -f l4d2-server-docker-compose.yml -p l4d2 exec -T l4d2-server sh -c "$forge" \
            || docker compose -f l4d2-server-docker-compose.yml -p l4d2 exec -T -u 0 l4d2-server sh -c "$forge"
          docker compose -f l4d2-server-docker-compose.yml -p l4d2 restart l4d2-server
          for _ in $(seq 1 30); do
            rc=0; tools/steam-uptodate.sh --check || rc=$?
            [ "$rc" = 3 ] || break
            sleep 10
          done
          [ "$rc" = 1 ] || { echo "::error::the stale server was not called out of date (exit $rc)"; exit 1; }
          rc=0; out="$(tools/steam-uptodate.sh)" || rc=$?
          echo "$out"
          if [ "$rc" != 1 ] || [[ $out != *"baked into the image"* ]]; then
            echo "::error::the timer's script did not say the image needs replacing (exit $rc)"; exit 1
          fi

      - name: Stop
        if: always()
        run: docker compose -f l4d2-server-docker-compose.yml -p l4d2 down -v --remove-orphans

  sourcemod:
    name: The SourceMod plugins compile
    # With the compiler SourceMod itself ships, pinned by checksum. A plugin
    # that does not compile is a plugin the server silently runs without.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # AlliedModders publishes builds as GitHub releases now; the drop server
    # (sm.alliedmods.net/smdrop) answered 404 for every path from 2026-10-21.
    # The same build, the same bytes: GitHub's digest for this asset is the
    # checksum pinned here.
    env:
      SM_RELEASE: 1.12.0.7253
      SM_TARBALL: sourcemod-1.12.0-git7253-linux.tar.gz
      SM_SHA256: 6bbcab989cda0ada83600d0dcb0f46affd16529b2b02ed2dba1b5baeaf02fdb4
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the compiler and check its checksum
        run: |
          curl -fsSL "https://github.com/alliedmodders/sourcemod/releases/download/$SM_RELEASE/$SM_TARBALL" -o sm.tgz
          echo "$SM_SHA256  sm.tgz" | sha256sum -c -
          mkdir -p sm && tar -xzf sm.tgz -C sm

      - name: Compile every plugin in sourcemod/scripting
        run: |
          cd sm/addons/sourcemod/scripting
          status=0
          for src in "$GITHUB_WORKSPACE"/sourcemod/scripting/*.sp; do
            name="$(basename "$src" .sp)"
            if ./spcomp64 -i include -o "/tmp/$name.smx" "$src" | grep -E "error|warning"; then
              status=1
            fi
            [ -s "/tmp/$name.smx" ] && echo "$name.smx: $(stat -c %s "/tmp/$name.smx") bytes" || status=1
          done
          exit "$status"
